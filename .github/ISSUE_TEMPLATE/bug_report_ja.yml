name: "不具合を報告 · 日本語"
description: "発生した問題と再現手順を教えてください。"
labels:
  - "bug"
  - "needs-triage"
body:
  -
    type: "markdown"
    attributes:
      value: "このIssueと添付ファイルは公開されます。個人情報を隠してください。領収書や認証情報を投稿しないでください。"
  -
    type: "input"
    id: "app_version"
    attributes:
      label: "アプリのバージョンとビルド番号"
    validations:
      required: true
  -
    type: "input"
    id: "macos_version"
    attributes:
      label: "macOSのバージョン"
    validations:
      required: true
  -
    type: "textarea"
    id: "steps"
    attributes:
      label: "再現手順"
    validations:
      required: true
  -
    type: "textarea"
    id: "expected"
    attributes:
      label: "期待した結果"
    validations:
      required: true
  -
    type: "textarea"
    id: "actual"
    attributes:
      label: "実際の結果"
    validations:
      required: true
  -
    type: "textarea"
    id: "details"
    attributes:
      label: "追加情報（個人情報を隠した画像・動画・エラーメッセージ）"
    validations:
      required: false
