name: "기능 제안 · 한국어"
description: "더 편리하게 하고 싶은 작업을 알려 주세요."
labels:
  - "enhancement"
  - "needs-triage"
body:
  -
    type: "markdown"
    attributes:
      value: "이 이슈와 첨부 파일은 공개됩니다. 개인정보를 가려 주세요. 영수증이나 인증 정보를 올리지 마세요."
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "어떤 문제를 해결하고 싶으신가요?"
    validations:
      required: true
  -
    type: "textarea"
    id: "suggestion"
    attributes:
      label: "제안하는 방법"
    validations:
      required: true
  -
    type: "textarea"
    id: "examples"
    attributes:
      label: "참고 사례 또는 다른 방법"
    validations:
      required: false
