name: 버그 신고 · Bug report
description: 예상과 다르게 동작하는 문제를 알려 주세요. Report something that does not work as expected.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈와 첨부 파일은 공개됩니다. 개인정보를 가려 주세요. 한국어 또는 영어로 작성할 수 있습니다.
        This issue and its attachments are public. Redact private information. Korean and English are welcome.
  - type: input
    id: app_version
    attributes:
      label: 앱 버전 · App version
      placeholder: 버전과 빌드 번호 / Version and build number
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS 버전 · macOS version
      placeholder: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 · Steps to reproduce
      description: 어떤 순서로 문제가 발생하는지 설명해 주세요. Describe the steps that trigger the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 · Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과 · Actual result
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 참고 자료 · Additional details
      description: 개인정보를 가린 스크린샷, 영상, 오류 메시지가 있으면 첨부해 주세요. Attach redacted screenshots, recordings, or error messages if useful.
