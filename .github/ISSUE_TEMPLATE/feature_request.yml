name: "Suggest a feature · English"
description: "Share a task you would like to make easier."
labels:
  - "enhancement"
  - "needs-triage"
body:
  -
    type: "markdown"
    attributes:
      value: "This issue and its attachments are public. Redact private information. Do not post receipts or credentials."
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "What problem would you like to solve?"
    validations:
      required: true
  -
    type: "textarea"
    id: "suggestion"
    attributes:
      label: "Suggested improvement"
    validations:
      required: true
  -
    type: "textarea"
    id: "examples"
    attributes:
      label: "Examples or alternatives"
    validations:
      required: false
