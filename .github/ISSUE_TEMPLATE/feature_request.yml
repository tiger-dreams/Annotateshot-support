name: 기능 제안 · Feature request
description: 더 편리한 사용 방법이나 새 기능을 제안해 주세요. Suggest an improvement or a new feature.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        한국어 또는 영어로 작성해 주세요. 이 이슈는 공개되며, 제안은 구현이나 출시일을 보장하지 않습니다.
        Korean and English are welcome. This issue is public; requests do not guarantee implementation or a release date.
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제 · Problem to solve
      description: 어떤 작업에서 불편함을 느꼈나요? What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 제안하는 방법 · Suggested improvement
      description: 원하는 동작을 구체적으로 설명해 주세요. Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 참고 사례 · Examples or alternatives
      description: 참고 이미지나 다른 방법이 있다면 적어 주세요. 개인정보는 가려 주세요. Add examples or alternatives, with private information redacted.
