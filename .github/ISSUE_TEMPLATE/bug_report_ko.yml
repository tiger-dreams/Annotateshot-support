name: "버그 신고 · 한국어"
description: "발생한 문제와 재현 방법을 알려 주세요."
labels:
  - "bug"
  - "needs-triage"
body:
  -
    type: "markdown"
    attributes:
      value: "이 이슈와 첨부 파일은 공개됩니다. 개인정보를 가려 주세요. 영수증이나 인증 정보를 올리지 마세요."
  -
    type: "input"
    id: "app_version"
    attributes:
      label: "앱 버전과 빌드 번호"
    validations:
      required: true
  -
    type: "input"
    id: "macos_version"
    attributes:
      label: "macOS 버전"
    validations:
      required: true
  -
    type: "textarea"
    id: "steps"
    attributes:
      label: "재현 방법"
    validations:
      required: true
  -
    type: "textarea"
    id: "expected"
    attributes:
      label: "기대한 결과"
    validations:
      required: true
  -
    type: "textarea"
    id: "actual"
    attributes:
      label: "실제 결과"
    validations:
      required: true
  -
    type: "textarea"
    id: "details"
    attributes:
      label: "추가 정보 (개인정보를 가린 스크린샷·영상·오류 메시지)"
    validations:
      required: false
